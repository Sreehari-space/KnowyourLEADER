<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google-site-verification" content="3gtALKTmcH0YKk6t6LrFm3775Jm3lKx3wSq_uL06TQQ" />
    <title>TN Leaders — Tamil Nadu Candidate Transparency Portal 2026</title>
    <link rel="icon" type="image/png" href="/logo.png" />
    
    <!--
      These tags are the baseline the app then rewrites in place at runtime
      (src/utils/documentMeta.ts). They must stay: crawlers that do not execute
      JavaScript — Twitterbot among them — only ever see these.
    -->

    <!-- Primary SEO Meta Tags -->
    <meta name="description" content="TN Leaders — the public record of the Tamil Nadu 2026 election. Assets, net worth, education and declared criminal cases for every candidate, taken from their official ECI Form 26 affidavits." />
    <meta name="keywords" content="M K Stalin assets 2026, Edappadi Palaniswami net worth, K Annamalai election affidavit, Seeman criminal cases, Tamil Nadu election 2026 candidates, ECI Form 26 election portal, candidate affidavits TN 2026, political assets database Tamil Nadu" />
    <meta name="author" content="TN Leaders" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="https://tn-leaders.pages.dev" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tn-leaders.pages.dev" />
    <meta property="og:title" content="TN Leaders — Tamil Nadu Candidate Transparency Portal" />
    <meta property="og:description" content="The post-election record: assets, criminal cases and qualifications every Tamil Nadu 2026 candidate declared on oath." />
    <meta property="og:image" content="https://tn-leaders.pages.dev/og-image.jpg" />
    <meta property="og:site_name" content="TN Leaders" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://tn-leaders.pages.dev" />
    <meta property="twitter:title" content="TN Leaders — Tamil Nadu Candidate Transparency Portal" />
    <meta property="twitter:description" content="What every TN 2026 candidate declared on oath — assets, criminal cases, qualifications." />
    <meta property="twitter:image" content="https://tn-leaders.pages.dev/og-image.jpg" />

    <!-- Geo-tagging for regional search priority in Google India/Tamil Nadu -->
    <meta name="geo.region" content="IN-TN" />
    <meta name="geo.placename" content="Chennai, Tamil Nadu" />

    <script id="seo-schema" type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "TN Leaders",
        "description": "Public record of candidate declarations for the Tamil Nadu 2026 legislative assembly election.",
        "url": "https://tn-leaders.pages.dev"
      }
    </script>
  </head>
  <body>


    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
